<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Rush 🎮</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1b1b1b;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 50px;
        }

        .hero p {
            margin-top: 10px;
            color: #aaa;
            font-size: 18px;
        }

        .games {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .games h2 {
            margin-bottom: 20px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #1c1c1c;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            border: 1px solid #333;
            transition: 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #777;
        }

        .game-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .game-card h3 {
            margin-bottom: 10px;
        }

        .play-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: white;
            color: black;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🎮 Pixel Rush</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Games</a>
    </nav>
</header>

<section class="hero">
    <h1>Pixel Rush</h1>
    <p>Free online games, all in one place.</p>
</section>

<section class="games">
    <h2>🔥 Featured Games</h2>

    <div class="game-grid">

        <div class="game-card">
            <div class="game-icon">🚀</div>
            <h3>Space Rush</h3>
            <p>Coming soon...</p>
            <a class="play-btn" href="#">Play</a>
        </div>

        <div class="game-card">
            <div class="game-icon">🧩</div>
            <h3>Pixel Puzzle</h3>
            <p>Coming soon...</p>
            <a class="play-btn" href="#">Play</a>
        </div>

        <div class="game-card">
            <div class="game-icon">🏎️</div>
            <h3>Pixel Racer</h3>
            <p>Coming soon...</p>
            <a class="play-btn" href="#">Play</a>
        </div>

    </div>
</section>

<footer>
    © 2026 Pixel Rush
</footer>

</body>
</html>
